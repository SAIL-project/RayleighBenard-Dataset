program: rbcdata/sbsa.py
name: Result Training
method: grid
metric:
  goal: maximize
  name: eval/mean_reward
parameters:
  ra:
    values: [10_000, 100_000, 1_000_000]
  sb3.model:
    value: "ppo"
  sb3.nr_processes:
    value: 30
  sb3.nr_eval_processes:
    value: 5
  sb3.train_steps:
    value: 300_000
  sb3.frame_stack:
    value: 1
  sb3.ppo.lr:
    value: 0.001
  sb3.ppo.gamma:
    value: 0.95
  sb3.ppo.ent_coef:
    value: 0.1

command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
