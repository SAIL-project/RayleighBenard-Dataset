program: rbcdata/sbsa.py
name: PPO
method: bayes
metric:
  goal: maximize
  name: eval/mean_reward
parameters:
  ra:
    values: [10_000]
  sb3.model:
    value: "ppo"
  sb3.nr_processes:
    value: 30
  sb3.nr_eval_processes:
    value: 5
  sb3.train_steps:
    value: 150_000
  sb3.frame_stack:
    values: [1, 4]
  sb3.ppo.lr:
    values: [0.0001, 0.001]
  sb3.ppo.gamma:
    values: [0.9, 0.95, 0.99]
  sb3.ppo.ent_coef:
    values: [0.0, 0.001, 0.01, 0.1]

command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
