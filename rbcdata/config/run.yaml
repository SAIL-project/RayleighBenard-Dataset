defaults:
  - hydra: default
  - env: default
  - _self_
  - generate: null

task: run
seed: null
interval: 1
render_mode: human # null, "human" or "rgb_array"

env:
  ra: 10_000
  checkpoint: "data/checkpoints/ra${env.ra}/test"
  episode_length: 300
  action_duration: 1.5
  dt: 0.025

hydra:
  job:
    chdir: true
